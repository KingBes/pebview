name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:

  build-windows-x86_64:
    runs-on: windows-2022
    name: Build for Windows x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        # 安装 MSVC 的 C++ 工作负载与 Windows SDK
        # （不再需要 mingw 与 cmake：Toast 已并入 PebView，且由 MSVC 统一编译）
        choco install -y visualstudio2022-workload-vctools
        choco install -y windows-sdk-10

    - name: Build PebView.dll
      shell: cmd
      run: source\build.cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x86_64
        path: ./lib/windows/x86_64/*
        if-no-files-found: error

  build-linux-x86_64:
    runs-on: ubuntu-latest
    name: Build for Linux x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config
        sudo apt-get install libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev libglib2.0-dev

    - name: Build PebView.so
      run: |
        chmod +x ./source/linux.sh
        ./source/linux.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64
        path: ./lib/linux/x86_64/*
        if-no-files-found: error

  build-linux-aarch64:
    runs-on: ubuntu-22.04-arm
    name: Build for Linux aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config
        sudo apt-get install libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev libglib2.0-dev

    - name: Build PebView.so
      run: |
        chmod +x ./source/linux.sh
        ./source/linux.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-aarch64
        path: ./lib/linux/aarch64/*
        if-no-files-found: error

  # GitHub 已不再提供 macOS x86_64 runner。
  # macOS SDK 支持交叉编译，因此在 arm64 runner 上一次性产出两套架构。
  build-macos:
    runs-on: macos-latest
    name: Build for macOS x86_64 + arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build PebView.dylib (both arches)
      run: |
        chmod +x ./source/macos.sh
        ./source/macos.sh x86_64 arm64

    - name: Upload artifact (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: macos-x86_64
        path: ./lib/macos/x86_64/*
        if-no-files-found: error

    - name: Upload artifact (arm64)
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64
        path: ./lib/macos/arm64/*
        if-no-files-found: error
