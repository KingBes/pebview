name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:

  build-windows-x86_64:
    runs-on: windows-2022
    name: Build for Windows x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ABI 校验由 source/check-abi.php 完成。构建脚本在找不到 php 时只打 WARN 跳过，
    # 所以这里显式断言一次：宁可在这一步失败，也不要静默地不做校验。
    - name: Verify PHP (used for the ABI check)
      run: php --version

    # 不再安装任何依赖：windows-2022 镜像已预装
    #   Visual Studio 2022（含 Microsoft.VisualStudio.Component.VC.Tools.x86.x64）
    #   Windows SDK 10.0.17763 / 19041 / 22621 / 26100
    # 原步骤里的 windows-sdk-10 在 Chocolatey 社区源中并不存在，会直接 exit 1。
    # 而 visualstudio2022-workload-vctools 会在已有 Enterprise 之外再装一个 Build Tools 实例，
    # 反而有让 vswhere -latest 选错实例的风险。
    - name: Build PebView.dll
      shell: cmd
      run: source\build.cmd

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-x86_64
        path: ./lib/windows/x86_64/*
        if-no-files-found: error

  build-linux-x86_64:
    runs-on: ubuntu-latest
    name: Build for Linux x86_64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ABI 校验由 source/check-abi.php 完成。构建脚本在找不到 php 时只打 WARN 跳过，
    # 所以这里显式断言一次：宁可在这一步失败，也不要静默地不做校验。
    - name: Verify PHP (used for the ABI check)
      run: php --version

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config
        sudo apt-get install libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev libglib2.0-dev

    - name: Build PebView.so
      run: |
        chmod +x ./source/linux.sh
        ./source/linux.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64
        path: ./lib/linux/x86_64/*
        if-no-files-found: error

  build-linux-aarch64:
    runs-on: ubuntu-22.04-arm
    name: Build for Linux aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ABI 校验由 source/check-abi.php 完成。构建脚本在找不到 php 时只打 WARN 跳过，
    # 所以这里显式断言一次：宁可在这一步失败，也不要静默地不做校验。
    - name: Verify PHP (used for the ABI check)
      run: php --version

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config
        sudo apt-get install libgtk-3-dev libwebkit2gtk-4.1-dev libnotify-dev libglib2.0-dev

    - name: Build PebView.so
      run: |
        chmod +x ./source/linux.sh
        ./source/linux.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-aarch64
        path: ./lib/linux/aarch64/*
        if-no-files-found: error

  # GitHub 已不再提供 macOS x86_64 runner。
  # macOS SDK 支持交叉编译，因此在 arm64 runner 上一次性产出两套架构。
  build-macos:
    runs-on: macos-latest
    name: Build for macOS x86_64 + arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # macOS runner 上 php 不在 PATH（实测 `php: command not found`），所以这里不做断言，
    # macos.sh 内部的校验会打 WARN 跳过；两个架构的 dylib 由末尾的 verify-abi job 兜底校验。
    - name: Build PebView.dylib (both arches)
      run: |
        chmod +x ./source/macos.sh
        ./source/macos.sh x86_64 arm64

    - name: Upload artifact (x86_64)
      uses: actions/upload-artifact@v4
      with:
        name: macos-x86_64
        path: ./lib/macos/x86_64/*
        if-no-files-found: error

    - name: Upload artifact (arm64)
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64
        path: ./lib/macos/arm64/*
        if-no-files-found: error

  # 统一校验各平台产物的 ABI。放在 ubuntu 上有两个原因：
  #   1. ubuntu 自带 php（8.3.x，在 PATH 里），不需要为 macOS runner 额外装 php；
  #   2. 这里校验的是**上传后的 artifact**，比校验构建目录里的文件更接近真实发布物。
  # check-abi.php 直接解析 PE / ELF / Mach-O，与宿主机系统无关，所以跨平台校验没问题。
  verify-abi:
    runs-on: ubuntu-latest
    name: Verify exported ABI of every artifact
    needs: [ build-windows-x86_64, build-linux-x86_64, build-linux-aarch64, build-macos ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Verify ABI
      run: |
        php --version
        fail=0
        for target in \
          windows-x86_64/PebView.dll \
          linux-x86_64/PebView.so \
          linux-aarch64/PebView.so \
          macos-x86_64/PebView.dylib \
          macos-arm64/PebView.dylib ; do
          php source/check-abi.php --def source/exports.def --lib "artifacts/$target" || fail=1
        done
        exit $fail
